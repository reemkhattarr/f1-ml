[project]
name = "f1-foundation"
version = "0.1.0"
description = "Shared F1 data foundation: FastF1 ingestion + the data explorer that every project builds on."
requires-python = "==3.11.*"
dependencies = [
    "fastf1>=3.4.0",
    "pandas>=2.2.0",
    "numpy>=2.0.0",
    "pyarrow>=24.0.0",
    "gradio>=6.15.2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/f1_foundation"]
