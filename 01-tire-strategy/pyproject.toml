[project]
name = "tire-strategy"
version = "0.1.0"
description = "Predict optimal pit-stop timing and tire compound from live F1 race state."
requires-python = "==3.11.*"
dependencies = [
    "fastf1>=3.4.0",
    "pandas>=2.2.0",
    "numpy>=2.0.0",
    "scikit-learn>=1.5.0",
    "lightgbm>=4.5.0",
    "matplotlib>=3.9.0",
    "mlflow>=2.19.0",
    "pyarrow>=24.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/tire_strategy"]
