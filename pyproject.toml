# Root of the F1 ML portfolio uv workspace.
# This file is the *coordinator*: it owns the shared dev toolchain, the shared
# lockfile (uv.lock), and the list of workspace members. It is intentionally a
# virtual (non-package) root — it ships no importable code itself.
[project]
name = "f1-ml-portfolio"
version = "0.0.0"
description = "F1 machine learning portfolio — a uv workspace of independent, production-grade ML projects."
requires-python = "==3.11.*"
dependencies = []

[tool.uv]
package = false

[tool.uv.workspace]
# Members are added here as each project is scaffolded.
members = ["01-tire-strategy"]

# Shared development toolchain, installed into the single workspace venv.
[dependency-groups]
dev = [
    "ruff>=0.9.0",
    "pyright>=1.1.390",
    "pytest>=8.3.0",
    "pytest-cov>=6.0.0",
    "pre-commit>=4.0.0",
    "mlflow>=2.19.0",
    "dvc>=3.58.0",
]

# ---------------------------------------------------------------------------
# Tooling configuration (shared across all workspace members)
# ---------------------------------------------------------------------------
[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
# A deliberately broad, modern ruleset: pycodestyle/pyflakes, isort, pyupgrade,
# flake8-bugbear, comprehensions, simplify, naming, and pandas-vet.
select = ["E", "F", "I", "UP", "B", "C4", "SIM", "N", "PD", "RUF"]
ignore = [
    "PD901",  # allow `df` as a dataframe name — it is idiomatic in this domain
]

[tool.ruff.lint.isort]
known-first-party = ["tire_strategy"]

[tool.pyright]
pythonVersion = "3.11"
typeCheckingMode = "standard"
venvPath = "."
venv = ".venv"
reportMissingTypeStubs = false

[tool.pytest.ini_options]
addopts = "-ra --strict-markers"
testpaths = ["01-tire-strategy/tests"]
