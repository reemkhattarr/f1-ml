name: Backfill explorer (all sessions)

# Keeps the F1 Data Explorer Space (reemkhattar/f1-data-explorer) up to date.
#
# Each run pulls the explorer's current parquets from the Space, fetches sessions
# it doesn't have yet (newest first, at most what FastF1's ~500 calls/hour allows)
# and redeploys the Space when anything changed. Sessions that never got data
# (cancelled / unpublished) are remembered in explorer_unavailable.json so they
# don't eat the call budget on every run.
#
# Runs every 6 hours Friday-Monday (race weekends) and on manual trigger.
# A run fails if it hit the rate limit without resolving a single session — that
# means the backfill is stuck, rather than "nothing new".

on:
  workflow_dispatch: {}
  schedule:
    - cron: "17 */6 * * 0,1,5,6" # every 6h on Sun, Mon, Fri, Sat (UTC)

permissions:
  contents: read

concurrency:
  group: backfill-explorer
  cancel-in-progress: false

jobs:
  backfill:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v5

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.11

      - name: Cache FastF1 downloads
        uses: actions/cache@v5
        with:
          path: data/cache
          key: fastf1-cache-${{ github.run_id }}
          restore-keys: fastf1-cache-

      - name: Sync dependencies
        run: uv sync --all-packages

      - name: Require HF_TOKEN
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          if [ -z "$HF_TOKEN" ]; then
            echo "::error::HF_TOKEN secret is not set."
            exit 1
          fi

      - name: Pull the explorer's current data from the Space
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          mkdir -p data/processed
          for f in raw_laps.parquet weather.parquet results.parquet tire_strategy_dataset.parquet \
                   stint_laps.parquet telemetry_features.parquet explorer_unavailable.json; do
            for p in "data/processed/$f" "01-tire-strategy/data/processed/$f"; do
              if uv run hf download reemkhattar/f1-data-explorer "$p" --repo-type space \
                   --local-dir /tmp/space --token "$HF_TOKEN" >/dev/null 2>&1; then
                cp "/tmp/space/$p" data/processed/
                echo "Pulled $f"
                break
              fi
            done
          done

      - name: Fetch new sessions
        id: batch
        run: |
          set -o pipefail
          uv run python -m f1_foundation.explorer_data 2>&1 | tee /tmp/batch.log
          line="$(grep -E '^RESULT ' /tmp/batch.log | tail -1)"
          added="$(echo "$line" | sed -E 's/.*added=([0-9]+).*/\1/')"
          unavailable="$(echo "$line" | sed -E 's/.*unavailable=([0-9]+).*/\1/')"
          limited="$(echo "$line" | sed -E 's/.*rate_limited=([01]).*/\1/')"
          echo "added=${added:-0}" >> "$GITHUB_OUTPUT"
          echo "unavailable=${unavailable:-0}" >> "$GITHUB_OUTPUT"
          echo "Added ${added:-0} session(s), marked ${unavailable:-0} unavailable, rate limited: ${limited:-0}"
          if [ "${limited:-0}" = "1" ] && [ "${added:-0}" = "0" ] && [ "${unavailable:-0}" = "0" ]; then
            echo "::error::Hit the FastF1 rate limit without resolving any session - the backfill is stuck."
            echo "stuck=1" >> "$GITHUB_OUTPUT"
          fi

      - name: Build + redeploy the explorer Space
        if: steps.batch.outputs.added != '0' || steps.batch.outputs.unavailable != '0'
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          uv run python 00-data-explorer/deploy/build_explorer_space.py
          uv run hf upload reemkhattar/f1-data-explorer \
            00-data-explorer/deploy/explorer_space_build . --repo-type space --token "$HF_TOKEN"

      - name: Nothing new?
        if: steps.batch.outputs.added == '0' && steps.batch.outputs.unavailable == '0' && steps.batch.outputs.stuck != '1'
        run: echo "::notice::No new sessions since the last run - nothing to deploy."

      - name: Fail if stuck
        if: steps.batch.outputs.stuck == '1'
        run: exit 1
