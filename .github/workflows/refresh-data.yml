name: Train & publish tire-strategy model

# Keeps the tire-strategy model and its public demo current, entirely in the cloud.
#
# 1. Load the existing dataset (GitHub release "data-latest"; first run falls back
#    to the old Hugging Face Space) and add any races it does not have yet.
# 2. Retrain when there are new races (or when run by hand), holding out the
#    latest season with enough races (2026) as the test set.
# 3. Quality gate: publish only if the new model beats both baselines and is not
#    worse than the live model (see tire_strategy/gate.py).
# 4. Export the race-replay site and deploy it to GitHub Pages:
#    https://reemkhattarr.github.io/f1-ml/
# 5. Save the dataset and model files to the "data-latest" release.
#
# Runs every Monday after the race weekend, and on demand from the Actions tab.

on:
  workflow_dispatch:
    inputs:
      retrain:
        description: "Retrain and republish even if there are no new races"
        type: boolean
        default: true
  schedule:
    - cron: "0 9 * * 1"

permissions:
  contents: write   # update the data-latest release
  pages: write      # deploy the demo
  id-token: write   # required by deploy-pages

concurrency:
  group: refresh-data
  cancel-in-progress: false

env:
  GH_TOKEN: ${{ github.token }}
  DATA: data/processed
  ARTIFACTS: 01-tire-strategy/artifacts
  SITE: 01-tire-strategy/deploy/site_build

jobs:
  train:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    outputs:
      publish: ${{ steps.gate.outputs.publish }}
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - run: uv python install 3.11
      - run: uv sync --all-packages --locked
      - name: Cache FastF1 downloads
        uses: actions/cache@v5
        with:
          path: data/cache
          key: fastf1-cache-${{ github.run_id }}
          restore-keys: fastf1-

      - name: Load the existing dataset
        run: |
          mkdir -p "$DATA"
          if gh release download data-latest --pattern '*.parquet' --dir "$DATA" --clobber 2>/dev/null; then
            echo "Loaded dataset from the data-latest release"
          else
            for f in tire_strategy_dataset results; do
              uv run hf download reemkhattar/f1-tire-strategy "data/processed/$f.parquet" \
                --repo-type space --local-dir /tmp/seed >/dev/null 2>&1 \
                && cp "/tmp/seed/data/processed/$f.parquet" "$DATA/" || true
            done
            echo "Loaded dataset from the Hugging Face Space (first run)"
          fi
          if [ ! -f "$DATA/tire_strategy_dataset.parquet" ]; then
            echo "::error::No existing dataset found; refusing to rebuild from scratch (FastF1 rate limit)."
            exit 1
          fi

      - name: Add new races
        id: update
        run: |
          count() { uv run python -c "import pandas as pd; df = pd.read_parquet('$DATA/tire_strategy_dataset.parquet'); print(len(df[['year', 'round']].drop_duplicates()))"; }
          before="$(count)"
          uv run python -m tire_strategy.data.dataset --update 2022 2023 2024 2025 2026
          after="$(count)"
          echo "Races before: $before, after: $after"
          echo "new=$((after - before))" >> "$GITHUB_OUTPUT"
          if [ "$after" -lt "$before" ]; then
            echo "::error::Dataset shrank ($before -> $after races); stopping."
            exit 1
          fi

      - name: Save the dataset
        if: steps.update.outputs.new != '0'
        run: |
          gh release view data-latest >/dev/null 2>&1 || gh release create data-latest \
            --title "Latest data and model" --notes "Updated automatically by the training workflow." --latest=false
          gh release upload data-latest "$DATA"/*.parquet --clobber

      - name: Train
        id: train
        if: steps.update.outputs.new != '0' || inputs.retrain
        run: uv run python -m tire_strategy.train

      - name: Quality gate
        id: gate
        if: steps.train.outcome == 'success'
        run: |
          curl -fsSL https://reemkhattarr.github.io/f1-ml/data/metadata.json -o /tmp/live.json || : > /tmp/live.json
          uv run python -m tire_strategy.gate "$ARTIFACTS/metadata.json" /tmp/live.json
          echo "publish=true" >> "$GITHUB_OUTPUT"

      - name: Nothing new
        if: steps.train.outcome == 'skipped'
        run: echo "::notice::No new races and no retrain requested - the live model stays."

      - name: Build the demo site
        if: steps.gate.outputs.publish == 'true'
        run: uv run python -m tire_strategy.export_demo

      - uses: actions/upload-pages-artifact@v5
        if: steps.gate.outputs.publish == 'true'
        with:
          path: ${{ env.SITE }}

      - name: Save the model files
        if: steps.gate.outputs.publish == 'true'
        run: |
          gh release view data-latest >/dev/null 2>&1 || gh release create data-latest \
            --title "Latest data and model" --notes "Updated automatically by the training workflow." --latest=false
          gh release upload data-latest "$ARTIFACTS"/*.joblib "$ARTIFACTS"/metadata.json --clobber

  deploy:
    needs: train
    if: needs.train.outputs.publish == 'true'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
